services:
  # BiteVote Full-Stack Web Service on Render
  - type: web
    name: bitevote
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_DB_NAME
        value: bitevote
      - key: MONGODB_URI
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_API_BASE
        value: https://openrouter.ai/api/v1
      - key: GEMMA_MODEL
        value: google/gemma-2-27b-it

